name: CI

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }}, ${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The paper's stack: numpy 1.24.4, gymnasium 0.29.1.
          - python: "3.10"
            stack: paper
            extras: paper,dev
          # Latest versions the dependency pins allow.
          - python: "3.12"
            stack: latest
            extras: dev
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pip list | grep -iE "^(dm.control|mujoco|gymnasium|numpy) "
      - run: ruff check .
      - run: mypy
      - run: pytest -m "not slow"
      # Kept as an artifact so references for this platform can be checked or added.
      - name: Record reference rollouts on this platform
        if: always()
        run: python scripts/record_reference_rollouts.py "$RUNNER_TEMP/reference_rollouts.npz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-rollouts-python${{ matrix.python }}-${{ matrix.stack }}
          path: ${{ runner.temp }}/reference_rollouts.npz

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - name: Install the wheel into a fresh venv and use it
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-venv/bin/python "$GITHUB_WORKSPACE"/scripts/check_wheel.py
