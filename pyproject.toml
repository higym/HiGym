[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "higym"
dynamic = ["version"]
description = "High-DoF continuous-control environments for Gymnasium, built on dm_control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HiGym authors" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "dm-control==1.0.34",
    "mujoco==3.3.6",
    "gymnasium>=0.29.1",
    # numpy 2 changed np.interp in the last bit, which flips the 6-digit
    # rounding of joint ranges in walker-128 and cheetah-512 (tests/test_mjcf_parity.py).
    "numpy>=1.24,<2",
    "lxml",
]

[project.optional-dependencies]
# The rest of the software stack the paper's results were produced with.
paper = ["gymnasium==0.29.1", "numpy==1.24.4"]
dev = ["pytest", "ruff", "mypy", "build"]

[project.urls]
Homepage = "https://higym.github.io"
Repository = "https://github.com/higym/HiGym"

[tool.hatch.version]
path = "src/higym/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/higym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: large models; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 120
# Task modules stay byte-identical to the paper code; TD-MPC2 is example code kept as written.
extend-exclude = ["src/higym/tasks", "examples/tdmpc2", "scripts/render_embodiments.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
files = ["src/higym"]
exclude = ["src/higym/tasks/"]

[[tool.mypy.overrides]]
module = ["higym.tasks.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["dm_control.*"]
ignore_missing_imports = true
